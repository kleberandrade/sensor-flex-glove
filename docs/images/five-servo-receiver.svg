<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150" role="img" aria-labelledby="title desc">
<title id="title">Five-servo receiver: D2 through D6, fused external power and common ground</title>
<desc id="desc">Receiver Uno channels 0 to 4 drive index, middle, ring, little and thumb servo signals on D2, D3, D4, D5 and D6. An external regulated 4.8 volt supply feeds a fused distribution block and five separate servo power branches, with a common ground return and a separate ground link to the Uno. The reference budget is 5 times 2 amperes plus 20 percent headroom, or 12 amperes, to be checked against actual parts. Motor current does not pass through Uno or breadboard rails. Named terminals do not represent physical header order.</desc>
