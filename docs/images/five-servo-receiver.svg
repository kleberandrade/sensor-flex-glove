<text x="405" y="895" class="small" >Separate receiver ground link; motor returns go directly to the distributor.</text>
<text x="60" y="831" class="small" >Radio pins remain separate:</text>
<text x="60" y="858" class="small" >CE D7 · CSN D8 · SPI D11–D13</text>
<text x="60" y="885" class="small" >Radio VCC = Uno 3.3V, never motor V+.</text>
<text x="55" y="943" class="small" >Only dots/endpoints connect. Colored signal wires cross the power bars without joining them. Use insulated wiring.</text>
<rect x="25" y="988" width="1450" height="127" rx="18" fill="#edf4f8" stroke="#d3dfe8"/>
<text x="47" y="1023" class="heading" >No servo motor current through Uno or breadboard rails. Do not join motor V+ to Uno 5V / VIN.</text>
<text x="47" y="1056" class="small" >Pulse endpoints default to 1000–2000 µs per servo; tune each range unloaded. Invalid mask bits detach their channels.</text>
<text x="47" y="1087" class="small" >500 ms without a valid command detaches that output. Detach stops pulses; it neither cuts motor power nor guarantees release.</text>
<text x="35" y="1140" class="tiny" >Original SVG · MIT · Reference supply budget, not measured demand. Read the hardware guide for sizing, protection and staged checks.</text>
