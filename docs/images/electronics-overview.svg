<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="960" viewBox="0 0 1320 960" role="img" aria-labelledby="title desc">
<title id="title">Flex Sensor Glove electronics: two Uno nodes, flex divider, radios and servo</title>
<desc id="desc">Electronics-only reference illustration. The transmitter reads a passive flex sensor through a 10 kilohm divider on A0. Each Uno connects to an nRF24L01+ powered at 3.3 volts. The receiver controls a servo on D2 with a separate 4.8 volt supply and common local ground. Components are stylized, not a physical PCB layout.</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#526b80" stroke-width="1.6"/></marker>
 <g id="uno">
  <rect width="260" height="172" rx="14" fill="#167a87" stroke="#09505b" stroke-width="2"/>
  <rect x="-9" y="35" width="45" height="43" rx="4" fill="#c4cdd2" stroke="#667985"/>
  <rect x="52" y="81" width="145" height="34" rx="3" fill="#1f303d"/>
  <rect x="57" y="10" width="179" height="14" rx="2" fill="#1f303d"/>
  <rect x="57" y="147" width="179" height="14" rx="2" fill="#1f303d"/>
  <circle cx="15" cy="17" r="5" fill="#deebee"/><circle cx="245" cy="154" r="5" fill="#deebee"/>
  <text x="55" y="57" style="fill:white;font-size:19px;font-weight:bold">ARDUINO UNO R3</text>
  <text x="76" y="103" style="fill:white;font-size:16px">ATmega328P</text>
  <text x="57" y="135" style="fill:#d5f4f7;font-size:15px">5 V logic · USB power</text>
 </g>
 <g id="radio">
  <rect width="175" height="150" rx="9" fill="#286549" stroke="#164b34" stroke-width="2"/>
  <path d="M17 22 H55 V38 H33 V54 H64 V18 H100 V55 H155" fill="none" stroke="#c9b76d" stroke-width="4"/>
  <rect x="67" y="73" width="42" height="34" fill="#1c2931"/>
  <text x="14" y="130" style="fill:white;font-size:18px;font-weight:bold">nRF24L01+</text>
 </g>
</defs>
<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#17334a;font-size:18px}
 .title{font-size:32px;font-weight:bold}.heading{font-size:23px;font-weight:bold}
 .small{font-size:16px}.label{font-size:14px;font-weight:bold;letter-spacing:1px}
 .wire{fill:none;stroke:#526b80;stroke-width:2}.power{fill:none;stroke:#b76a25;stroke-width:2.5}
</style>
<rect width="1320" height="960" fill="#f7fafc"/>
<text x="36" y="51" class="title">The electronics behind the flex-sensor glove</text>
<text x="36" y="83">One active channel · component overview · reference design, not a photograph or physical PCB layout</text>
<rect x="30" y="111" width="610" height="697" rx="18" fill="white" stroke="#d7e3ec"/>
<rect x="660" y="111" width="630" height="697" rx="18" fill="white" stroke="#d7e3ec"/>
<text x="54" y="150" class="heading">TRANSMITTER / SENSOR NODE</text>
<text x="684" y="150" class="heading">RECEIVER / ACTUATOR NODE</text>
<!-- Passive sensor divider, shown electrically rather than as an invented module. -->
<text x="65" y="198">Uno 5V</text>
<path class="power" d="M140 192 H190 V211"/>
<rect x="174" y="211" width="32" height="78" rx="5" fill="#f4c668" stroke="#a57220" stroke-width="2"/>
<path d="M190 223 V277" stroke="#946219" stroke-width="3" stroke-dasharray="4 4"/>
<text x="224" y="239">Passive flex strip</text>
<text x="224" y="266" class="small">10 kΩ nominal reference</text>
<path class="wire" d="M190 289 V313 H126 V400"/>
<circle cx="190" cy="313" r="4" fill="#526b80"/>
<text x="75" y="358" class="small">A0 input</text>
<path class="wire" d="M190 313 H243"/>
<rect x="243" y="302" width="65" height="22" fill="#f9f0d4" stroke="#927b39" stroke-width="2"/>
<path class="wire" d="M308 313 H352 V333 M337 333 H367 M342 339 H362 M348 345 H356"/>
<text x="250" y="291" class="small">10 kΩ fixed</text>
<text x="373" y="333" class="small">Uno GND</text>
<use href="#uno" x="70" y="400"/>
<use href="#radio" x="410" y="414"/>
<path class="wire" d="M338 464 H400" marker-end="url(#arrow)"/>
<text x="346" y="445" class="small">SPI</text>
<text x="74" y="605">Read A0 → filter → calibrate → packet</text>
<text x="74" y="635" class="small">USB powers the Uno; no servo load on this node.</text>
<!-- Wireless link is a logical connection, never a shared ground wire. -->
<path class="wire" d="M585 490 H699" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="591" y="474" class="small">RF</text>
<use href="#radio" x="710" y="414"/>
<use href="#uno" x="970" y="400"/>
<path class="wire" d="M894 500 H957" marker-end="url(#arrow)"/>
<text x="905" y="485" class="small">SPI</text>
<!-- Servo and dedicated supply. -->
<rect x="697" y="193" width="218" height="102" rx="12" fill="#fff4d9" stroke="#d5b66e"/>
<text x="715" y="224" class="heading">External supply</text>
<text x="715" y="252">4.8 V regulated</text>
<text x="715" y="278" class="small">2 A reference budget</text>
<rect x="1068" y="207" width="149" height="100" rx="9" fill="#536a92" stroke="#30466c" stroke-width="2"/>
<circle cx="1142" cy="206" r="17" fill="#dbe4ef" stroke="#677b91" stroke-width="2"/>
<path d="M1115 206 H1169" stroke="#9daec3" stroke-width="8" stroke-linecap="round"/>
<text x="1084" y="250" style="fill:white;font-size:22px;font-weight:bold">SERVO</text>
<text x="1084" y="278" style="fill:#edf3fb;font-size:16px">SG90 reference</text>
<path class="power" d="M915 231 H1058" marker-end="url(#arrow)"/>
<text x="940" y="217" class="small">Servo V+</text>
<path class="wire" d="M915 279 H1008 V346 H1195 V307"/>
<circle cx="1008" cy="346" r="4" fill="#526b80"/>
<path class="wire" d="M1008 346 V389"/>
<text x="1025" y="378" class="small">Local GND</text>
<path class="wire" d="M1144 400 V318" marker-end="url(#arrow)"/>
<text x="1238" y="330" class="small">D2</text>
<text x="1238" y="354" class="small">signal</text>
<text x="704" y="605">Validate packet → command one servo</text>
<text x="704" y="635" class="small">No valid finger-0 command for 500 ms → detach.</text>
<!-- Shared named pins, each local to its own node. -->
<rect x="54" y="667" width="562" height="116" rx="12" fill="#edf4f8"/>
<rect x="684" y="667" width="582" height="116" rx="12" fill="#edf4f8"/>
<text x="72" y="696" class="label">UNO → RADIO · EACH NODE WIRED LOCALLY</text>
<text x="72" y="726" class="small">D7 → CE · D8 → CSN · D11 → MOSI · D13 → SCK</text>
<text x="72" y="752" class="small">D12 ← MISO · IRQ unconnected · VCC = 3.3 V, never 5 V</text>
<text x="702" y="696" class="label">POWER AND BYPASS</text>
<text x="702" y="726" class="small">100 nF + 10 µF across each radio's VCC / GND.</text>
<text x="702" y="752" class="small">Servo supply negative joins receiver GND; V+ stays separate.</text>
<text x="36" y="849">Direct 5 V radio input signals require Nordic's specified VDD condition: 2.7–3.3 V.</text>
<text x="36" y="879">Check actual component ratings, module pin labels and servo pulse limits before connecting power.</text>
<text x="36" y="909" class="small">Two wireless nodes do not need a ground wire between them. Each has its own local common ground.</text>
<text x="36" y="938" class="small">Original vector illustration · MIT · See docs/hardware/ for the detailed circuit, BOM and electrical constraints.</text>
</svg>
