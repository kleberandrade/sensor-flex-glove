[platformio]
src_dir = firmware
default_envs = transmitter, receiver, reader

[env]
platform = atmelavr@5.3.0
platform_packages =
    platformio/framework-arduino-avr@5.4.0
    platformio/toolchain-atmelavr@1.70300.191015
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
lib_deps = nrf24/RF24@1.6.2

[env:transmitter]
build_src_filter = +<transmitter/>

[env:receiver]
build_src_filter = +<receiver/>
lib_deps =
    ${env.lib_deps}
    arduino-libraries/Servo@1.3.0

[env:reader]
build_src_filter = +<transmitter/>
build_flags = ${env.build_flags} -DFLEX_READER_ONLY
lib_deps =
