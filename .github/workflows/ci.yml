name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test portable behavior and run reading example
        run: make test example
      - name: Exercise memory and undefined-behavior checks
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -Iinclude -fsanitize=address,undefined -fno-omit-frame-pointer tests/core_test.cpp -o /tmp/flex-tests
          /tmp/flex-tests
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: pio run
